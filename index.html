<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4B3F9E" />
    <meta name="description" content="A private, shared Bible study journal." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ardent" />
    <!-- The manifest link is injected by vite-plugin-pwa; a second one here would duplicate it. -->
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Ardent — Bible Study Journal</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #fbf8f2; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; }
      #root > * { flex: 1 1 0%; min-width: 0; min-height: 0; }
      * { box-sizing: border-box; }
      button, input, textarea { font: inherit; }
      input, textarea { font-size: 16px !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
