    <title>Ardent — Bible Study Journal</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #fbf8f2; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; }
      #root > * { flex: 1 1 0%; min-width: 0; min-height: 0; }
      * { box-sizing: border-box; }
      button, input, textarea { font: inherit; }
      input, textarea { font-size: 16px !important; }
      /* Each browser and the Android WebView drew its own focus box around text
         fields, which is the stray highlight users saw. Replace it with one
         branded ring so focus stays obvious and consistent everywhere. */
      input, textarea, select, [contenteditable] { outline: none; }
      input:focus, textarea:focus, select:focus, [contenteditable]:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(75, 63, 158, 0.16);
        border-color: #4B3F9E !important;
      }
      /* Some fields are a bordered row wrapping an icon and a bare input (tag,
         search, reflection, prayer). The border lives on the wrapper, so the
         ring has to move there too — otherwise those fields behave differently
         from the ones where the input is the field. */
      [data-fieldbox]:focus-within {
        box-shadow: 0 0 0 3px rgba(75, 63, 158, 0.16);
        border-color: #4B3F9E !important;
      }
      [data-fieldbox] input:focus,
      [data-fieldbox] textarea:focus {
        box-shadow: none;
        border-color: transparent !important;
      }
      /* Android WebView paints a grey flash on every tap. */
      * { -webkit-tap-highlight-color: transparent; }
    </style>

  <body>
    <div id="root"></div>
